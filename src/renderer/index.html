<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes env(safe-area-inset-*) report anything
      other than zero. Without it iOS letterboxes an installed web app inside
      the safe area and every inset is 0px — which looks exactly like the insets
      working, so the top bar and the bottom navigation in styles/mobile.css
      would be sitting under the notch and the home indicator with nothing
      anywhere saying why. No zoom is disabled: pinching out is how somebody
      reads a figure on this screen.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:"
    />
    <title>RM Operations App</title>
    <!--
      The web app's installable identity. Harmless in Electron, which loads this
      file over file:// and simply finds nothing at these paths.

      None of this is decoration, and on iOS none of it is optional:

        · THE MANIFEST is what turns "Add to Home Screen" from a bookmark into
          an app. A bookmark opens in a Safari tab, and a Safari tab cannot
          receive a push notification at all — so a missing or unreadable
          manifest looks exactly like the notifications being broken, which is
          the single most expensive way this feature can fail. See
          src/server/staticFiles.ts for the content type it must be served with.

        · THE APPLE TOUCH ICON is a second, older mechanism iOS reads for the
          home-screen icon itself. Without it the icon is a screenshot of
          whatever page was open — usually the login screen. It is a separate,
          FLATTENED file because iOS composites an icon onto black before
          applying its own rounding, so an alpha channel shows up as a dark
          ring inside the corners. See scripts/make-pwa-icons.mjs.

      Vite rewrites these to relative URLs (the renderer is built with a
      relative base so Electron can load it over file://), which resolves to the
      same thing for a page served at the site root — which is the only place
      this app is ever served from.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RM Ops" />
    <!--
      The colour iOS fills the notch strip and the home-indicator strip with on
      an installed web app — the two bands the top bar and the bottom navigation
      are drawn into (styles/mobile.css). This is --surface from
      src/renderer/src/styles/theme.css, restated as a hex because the tag has
      to be right BEFORE any stylesheet or script has loaded; it was a dark navy
      from when the app had a dark theme, which put a black band above a white
      app for every operator who had not chosen dark. lib/systemChrome.ts
      re-reads --surface and rewrites this tag once the CSS is up, so the hex
      here only has to survive the first frame and cannot drift permanently.
    -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
