name: Release

# Publishing a new version:
#   1. Bump "version" in package.json (e.g. 0.0.0 -> 0.0.1)
#   2. Commit, then tag:  git tag v0.0.1 && git push origin v0.0.1
#   3. This workflow builds the Windows .exe (and Mac builds) and attaches them
#      to a GitHub Release. electron-updater's "Check for updates" reads that
#      release feed, so every installed copy can then update itself.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder versions artifacts from package.json, not the git tag.
      # Fail fast if a tag was pushed that doesn't match, so the update feed can
      # never advertise the wrong version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json before tagging."
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}."

      - name: Build & publish (${{ matrix.platform }})
        run: npm run build:${{ matrix.platform }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are unsigned for now (Windows-only auto-update).
          CSC_IDENTITY_AUTO_DISCOVERY: false
