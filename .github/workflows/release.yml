name: Release

# Publishing a new version — either:
#   A) Tag it:   bump package.json version, then `git tag vX.Y.Z && git push --tags`
#   B) Marker:   put "[release]" in a commit message on the default branch
#   C) Manually: run this workflow from the Actions tab (workflow_dispatch)
# Any of these builds the Windows .exe (and Mac builds) and attaches them to a
# GitHub Release. electron-updater's "Check for updates" reads that release feed,
# so every installed copy can then update itself.

on:
  push:
    tags:
      - 'v*'
    branches:
      - claude/rm-operations-app-initial-3sml0r
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only publish on a tag, a manual run, or a commit explicitly marked
    # "[release]" — ordinary pushes to the branch are ignored so we don't
    # republish on every commit.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      # Run the platforms one at a time: both jobs publish to the same GitHub
      # release, and creating it concurrently races (422 already_exists). The
      # first job creates the release; the second reuses it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron's postinstall downloads its binary from GitHub, which
      # intermittently 504s. Retry so a transient blip doesn't fail the release.
      - name: Install dependencies (retry on transient download failures)
        shell: bash
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::npm ci failed after $n attempts"; exit 1
            fi
            echo "npm ci failed (attempt $n) — likely a transient GitHub download timeout; retrying in $((n*15))s…"
            npm cache verify || true
            sleep $((n*15))
          done

      # electron-builder versions artifacts from package.json, not the git tag.
      # Fail fast if a tag was pushed that doesn't match, so the update feed can
      # never advertise the wrong version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json before tagging."
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}."

      # electron-builder downloads its toolchain (winCodeSign / nsis) from GitHub
      # and then uploads the artifacts back — both can 504 when GitHub is flaky.
      # Retry the whole build/publish; electron-builder overwrites partial uploads.
      - name: Build & publish (${{ matrix.platform }})
        shell: bash
        run: |
          n=0
          until npm run build:${{ matrix.platform }} -- --publish always; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::build:${{ matrix.platform }} failed after $n attempts"; exit 1
            fi
            echo "build/publish failed (attempt $n) — likely a transient GitHub download/upload timeout; retrying in $((n*20))s…"
            sleep $((n*20))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are unsigned for now (Windows-only auto-install).
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Attach a cross-platform update.json to the GitHub release so the macOS/Linux
  # in-app "Check for updates" (which reads update.json) works while GitHub is
  # the active feed. Windows uses electron-updater's latest.yml directly.
  github-update-json:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Generate + upload update.json
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.V;
            const base = "https://github.com/" + process.env.REPO + "/releases/download/v" + v;
            const j = {
              version: v,
              releaseDate: new Date().toISOString(),
              downloads: {
                win: base + "/RM-Operations-App-Setup-" + v + ".exe",
                "mac-arm64": base + "/RM-Operations-App-" + v + "-arm64.dmg",
                "mac-x64": base + "/RM-Operations-App-" + v + "-x64.dmg"
              }
            };
            fs.writeFileSync("update.json", JSON.stringify(j, null, 2));
            console.log(j);
          '
          gh release upload "v$V" update.json --repo "$REPO" --clobber

  # ---------------------------------------------------------------------------
  # Mirror the release artifacts (+ a cross-platform update.json) to Cloudflare
  # R2 so updates are served from the Cloudflare feed instead of GitHub.
  # Stays OFF until you set the repo variable CLOUDFLARE_UPDATES = true and add
  # the R2 secrets — so it can never break the existing GitHub release. See
  # docs/UPDATES.md for setup.
  # ---------------------------------------------------------------------------
  cloudflare-publish:
    needs: release
    if: ${{ vars.CLOUDFLARE_UPDATES == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 + the AWS CLI: only send/validate checksums when the API requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CF_UPDATES_URL: ${{ vars.CF_UPDATES_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: |
          mkdir -p dist-assets
          gh release download "v${{ steps.v.outputs.version }}" \
            --repo "${{ github.repository }}" --dir dist-assets --clobber

      - name: Generate update.json
        run: |
          node -e '
            const fs = require("fs");
            const base = (process.env.CF_UPDATES_URL || "").replace(/\/$/, "");
            const files = fs.readdirSync("dist-assets");
            const find = (re) => files.find((f) => re.test(f));
            const url = (f) => (f ? base + "/" + encodeURIComponent(f) : undefined);
            const j = {
              version: require("./package.json").version,
              releaseDate: new Date().toISOString(),
              downloads: {
                win: url(find(/Setup-.*\.exe$/)),
                "mac-arm64": url(find(/-arm64\.dmg$/)),
                "mac-x64": url(find(/-x64\.dmg$/))
              }
            };
            fs.writeFileSync("dist-assets/update.json", JSON.stringify(j, null, 2));
            console.log(j);
          '

      - name: Sync to Cloudflare R2
        run: |
          # Large artifacts: cache aggressively (immutable, versioned filenames).
          aws s3 sync dist-assets "s3://${R2_BUCKET}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude "update.json" --exclude "latest*.yml" \
            --cache-control "public, max-age=31536000, immutable"
          # Feed files: never cache, so clients always see the newest version.
          for f in update.json latest.yml latest-mac.yml; do
            if [ -f "dist-assets/$f" ]; then
              ct="text/yaml"; [ "$f" = "update.json" ] && ct="application/json"
              aws s3 cp "dist-assets/$f" "s3://${R2_BUCKET}/$f" \
                --endpoint-url "${R2_ENDPOINT}" \
                --content-type "$ct" --cache-control "no-cache"
            fi
          done
