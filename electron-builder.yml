appId: com.rmcardz.operations
productName: RM Operations App
copyright: Copyright © RM Cardz

directories:
  buildResources: build
  output: release/${version}

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{.editorconfig,.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**
  # better-sqlite3 is a native module and must remain unpacked so its .node binary can be loaded
  - '**/*.node'

# ---------------------------------------------------------------------------
# Windows — produces the downloadable .exe installer
# ---------------------------------------------------------------------------
win:
  executableName: RM Operations App
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RM Operations App
  deleteAppDataOnUninstall: false
  # electron-updater differential download support
  differentialPackage: true

# ---------------------------------------------------------------------------
# macOS — for the Mac side of the team (auto-update wiring comes in a later pass)
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # No entitlements or usage strings: the app reads local files and talks to one
  # API. The camera usage string that used to live here was for the webcam
  # barcode decoder, which was removed in v0.0.51 — scanning is the handheld
  # wedge only, which is plain keyboard input. Declaring a permission the app
  # never exercises is a prompt users cannot explain and one more thing for
  # notarization to answer for.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Linux — convenience target for internal testing
# ---------------------------------------------------------------------------
linux:
  target:
    - AppImage
  category: Office
  maintainer: RM Cardz

# ---------------------------------------------------------------------------
# Update feed. Windows auto-update (electron-updater) reads latest.yml from the
# FIRST provider below — the Cloudflare-hosted generic feed. The generic
# provider is download-only, so CI uploads the built artifacts to Cloudflare R2
# (see .github/workflows/release.yml -> cloudflare-publish and docs/UPDATES.md).
#
# `url` MUST match UPDATE_FEED_URL in src/shared/config.ts and CF_UPDATES_URL in
# the release workflow. Complete the Cloudflare setup before releasing through
# it. GitHub is kept as a second publish target during the transition so
# existing GitHub-fed installs (<= v0.0.2) can still find the next version;
# remove it once everyone is on the Cloudflare feed.
# ---------------------------------------------------------------------------
publish:
  # GitHub is the ACTIVE feed until the Cloudflare setup (docs/UPDATES.md) is
  # complete. To switch updates to Cloudflare, move the `generic` entry to the
  # top (it becomes the feed the app checks) and enable the cloudflare-publish
  # CI job — do this only once the R2 bucket + custom domain are live.
  - provider: github
    owner: oofski
    repo: rmsportscarderp
    releaseType: release
  - provider: generic
    url: https://updates.rmcardz.com
    channel: latest
